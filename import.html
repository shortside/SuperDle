<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Importing...</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .container { padding: 20px; }
        .icon { font-size: 48px; margin-bottom: 15px; }
        .message { font-size: 18px; margin-bottom: 10px; }
        .count { color: #2ed573; font-size: 24px; font-weight: bold; }
        .sub { color: #888; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✅</div>
        <div class="message">Importing products...</div>
        <div class="count" id="count"></div>
        <div class="sub" id="sub">Closing automatically...</div>
    </div>
    
    <script>
        const STORAGE_KEY = 'dutch_products_v3';
        
        function getProducts() {
            return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        }
        
        function saveProducts(products) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
        }
        
        function importProducts(newProducts) {
            const products = getProducts();
            let added = 0;
            
            newProducts.forEach(p => {
                if (p.name && p.price && !products.some(existing => existing.name === p.name)) {
                    products.push({
                        name: p.name,
                        price: parseFloat(p.price),
                        image: p.image || '',
                        store: p.store || 'Shop',
                        addedAt: Date.now()
                    });
                    added++;
                }
            });
            
            saveProducts(products);
            return { added, total: products.length };
        }
        
        // Read data from URL hash
        try {
            const hash = window.location.hash.substring(1);
            if (hash) {
                const data = JSON.parse(decodeURIComponent(hash));
                const result = importProducts(data);
                
                if (result.added > 0) {
                    document.getElementById('count').textContent = `+${result.added} products added!`;
                    document.getElementById('sub').textContent = `Total: ${result.total} products`;
                } else {
                    document.querySelector('.icon').textContent = '📦';
                    document.getElementById('count').textContent = 'No new products';
                    document.getElementById('sub').textContent = 'All products were already in collection';
                }
                
                // Close popup after 1.5 seconds
                setTimeout(() => window.close(), 1500);
            } else {
                document.querySelector('.icon').textContent = '❌';
                document.querySelector('.message').textContent = 'No data received';
                document.getElementById('sub').textContent = 'Use the bookmarklet on a supermarket page';
            }
        } catch (e) {
            document.querySelector('.icon').textContent = '❌';
            document.querySelector('.message').textContent = 'Error importing';
            document.getElementById('count').textContent = e.message;
            document.getElementById('sub').textContent = '';
        }
    </script>
</body>
</html>
